<svg id="nesso-repeated-operators" viewBox="0 0 1200 586" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nesso-repeated-operators-title"><title id="nesso-repeated-operators-title">nesso repeated operators</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202830;font-size:13px}.label{font-weight:600;font-size:14px}.compact{font-size:12px}.small{font-size:11px;fill:#52606d}.mono{font-family:monospace;font-size:10px}.title{font-size:19px;font-weight:600}.num{font-size:12px;font-weight:600}.wire{fill:none;stroke:#77828a;stroke-width:1.25}.frozen{fill:#f4f5f6;stroke:#9da6ac;stroke-width:1}.plain{fill:white;stroke:#abb2b8;stroke-width:1}.head{fill:#e9f2fc;stroke:#2166ac;stroke-width:1.4}.adapter{fill:#fff6eb;stroke:#b85c00;stroke-width:1.3}.headtext{fill:#2166ac}.adaptertext{fill:#a85200}.frame{fill:none;stroke:#c1c7cc;stroke-width:1;stroke-dasharray:4 4}.rule{stroke:#d5dadd;stroke-width:1}</style><defs><marker id="nesso-repeated-operators-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#77828a"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="20" y="28" class="title" text-anchor="start">C   Repeated block and low-rank update</text><text x="20" y="64" class="label" text-anchor="start">PairformerNoSeqLayer · native trunk ×48; each affinity member ×8</text><rect x="20" y="93" width="215" height="90" rx="2" class="frozen"/><text x="30" y="114" class="label" text-anchor="start">Triangle multiplication</text><text x="30" y="133" class="small" text-anchor="start">Outgoing · width128</text><text x="30" y="149" class="small" text-anchor="start">Each operator: z ← z + update</text><path d="M235 138 L255 138" class="wire" marker-end="url(#nesso-repeated-operators-arrow)"/><rect x="255" y="93" width="215" height="90" rx="2" class="frozen"/><text x="265" y="114" class="label" text-anchor="start">Triangle multiplication</text><text x="265" y="133" class="small" text-anchor="start">Incoming · width128</text><text x="265" y="149" class="small" text-anchor="start">Each operator: z ← z + update</text><path d="M470 138 L490 138" class="wire" marker-end="url(#nesso-repeated-operators-arrow)"/><rect x="490" y="93" width="215" height="90" rx="2" class="frozen"/><text x="500" y="114" class="label" text-anchor="start">Triangle attention</text><text x="500" y="133" class="small" text-anchor="start">Starting node · 4×32</text><text x="500" y="149" class="small" text-anchor="start">Each operator: z ← z + update</text><path d="M705 138 L725 138" class="wire" marker-end="url(#nesso-repeated-operators-arrow)"/><rect x="725" y="93" width="215" height="90" rx="2" class="frozen"/><text x="735" y="114" class="label" text-anchor="start">Triangle attention</text><text x="735" y="133" class="small" text-anchor="start">Ending node · 4×32</text><text x="735" y="149" class="small" text-anchor="start">Each operator: z ← z + update</text><path d="M940 138 L960 138" class="wire" marker-end="url(#nesso-repeated-operators-arrow)"/><rect x="960" y="93" width="215" height="90" rx="2" class="frozen"/><text x="970" y="114" class="label" text-anchor="start">Gated transition</text><text x="970" y="133" class="small" text-anchor="start">128 → 512 → 128</text><text x="970" y="149" class="small" text-anchor="start">Each operator: z ← z + update</text><text x="20" y="210" class="small" text-anchor="start">Triangle multiplication uses learned gates; attention updates and transition have independent residual additions.</text><text x="20" y="233" class="small" text-anchor="start">The stack is pair-only: z [tokens,tokens,128]. There is no sequence-track attention or head transformer in this class.</text><rect x="20" y="267" width="555" height="275" rx="3" class="frame"/><text x="36" y="292" class="label" text-anchor="start">Gated transition (not a plain two-layer MLP)</text><rect x="40" y="315" width="126" height="60" rx="2" class="frozen"/><text x="50" y="336" class="label compact" text-anchor="start">LayerNorm</text><text x="50" y="355" class="small" text-anchor="start">Input width d</text><rect x="205" y="310" width="151" height="62" rx="2" class="frozen"/><text x="215" y="331" class="label compact" text-anchor="start">fc1: d → h</text><text x="215" y="350" class="small" text-anchor="start">SiLU activation</text><rect x="205" y="392" width="151" height="62" rx="2" class="frozen"/><text x="215" y="413" class="label compact" text-anchor="start">fc2: d → h</text><text x="215" y="432" class="small" text-anchor="start">Linear branch</text><path d="M166 344 L185 344 L205 341" class="wire" marker-end="url(#nesso-repeated-operators-arrow)"/><path d="M185 344 L185 423 L205 423" class="wire" marker-end="url(#nesso-repeated-operators-arrow)"/><path d="M356 341 L377 341 L377 382 L387 382" class="wire" marker-end="url(#nesso-repeated-operators-arrow)"/><path d="M356 423 L377 423 L377 382" class="wire"/><text x="391" y="386" class="label" text-anchor="start">×</text><path d="M405 382 L421 382" class="wire" marker-end="url(#nesso-repeated-operators-arrow)"/><rect x="421" y="349" width="134" height="64" rx="2" class="frozen"/><text x="431" y="370" class="label compact" text-anchor="start">fc3: h → d</text><text x="431" y="389" class="small" text-anchor="start">Residual + input</text><text x="36" y="489" class="small" text-anchor="start">Pairformer: d=128, h=512. Conditioner: d=128, h=256.</text><text x="36" y="511" class="small" text-anchor="start">LoRA targets only block-0 fc1 in each affinity stack.</text><rect x="605" y="267" width="575" height="275" rx="3" class="frame"/><text x="621" y="292" class="label" text-anchor="start">LoRA: frozen base plus a learned parallel update</text><rect x="725" y="321" width="254" height="60" rx="2" class="frozen"/><text x="735" y="342" class="label" text-anchor="start">Original Linear W₀ x + b</text><text x="735" y="361" class="small" text-anchor="start">Frozen weights and bias</text><rect x="725" y="411" width="254" height="60" rx="2" class="adapter"/><text x="735" y="432" class="label" text-anchor="start">A: in → 4; B: 4 → out</text><text x="735" y="451" class="small" text-anchor="start">Train A and B only · alpha / rank = 1</text><text x="630" y="386" class="label" text-anchor="start">x</text><path d="M652 382 L685 382 L685 351 L725 351" class="wire" marker-end="url(#nesso-repeated-operators-arrow)"/><path d="M685 382 L685 442 L725 442" class="wire" marker-end="url(#nesso-repeated-operators-arrow)"/><path d="M979 351 L1010 351 L1010 394" class="wire"/><path d="M979 442 L1010 442 L1010 394" class="wire"/><text x="1004" y="402" class="label" text-anchor="start">+</text><path d="M1025 394 L1118 394" class="wire" marker-end="url(#nesso-repeated-operators-arrow)"/><text x="1125" y="398" class="label" text-anchor="start">y</text><text x="621" y="496" class="small" text-anchor="start">y = W₀x + b + B(Ax); rank 4, alpha 4; B initialized to zero.</text><text x="621" y="518" class="small" text-anchor="start">Head-only updates W and b directly; it does not use LoRA.</text></svg>