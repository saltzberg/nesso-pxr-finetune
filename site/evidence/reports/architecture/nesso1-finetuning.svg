<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1150" viewBox="0 0 1620 1150" role="img" aria-labelledby="title desc"><title id="title">Exactly where Nesso affinity fine-tuning acts</title><desc id="desc">One affinity-member schematic applies independently to affinity_module and affinity_module2. Orange continuous-head weights and biases train in both arms; blue low-rank adapters train only in head plus LoRA. Gray surrounding weights remain frozen.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c7780"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1620" height="1150" fill="#fafbfd"/><text data-box="" x="40" y="52" font-size="34" fill="#18232d" font-weight="700">Fine-tuning inside the affinity branch</text><text data-box="" x="40" y="91" font-size="23" fill="#52616f" font-weight="400">Same selected layers in two independent native members: affinity_module and affinity_module2</text><text data-box="" x="40" y="139" font-size="23" fill="#52616f" font-weight="700">Frozen upstream context</text><text data-box="" x="400" y="139" font-size="23" fill="#18232d" font-weight="700">Affinity-member zoom</text><text data-box="" x="1140" y="139" font-size="23" fill="#ad501b" font-weight="700">Continuous readout</text><rect id="external-esm" x="40" y="180" width="300" height="95" rx="12" stroke="#a8b0b8" stroke-width="2" fill="#f0f2f4"/><text data-box="external-esm" x="58" y="210" font-size="20" fill="#52616f" font-weight="600">External ESM model</text><text data-box="external-esm" x="58" y="238" font-size="20" fill="#52616f" font-weight="400">Cached 1,280-d features</text><rect id="trunk" x="40" y="465" width="300" height="150" rx="12" stroke="#a8b0b8" stroke-width="2" fill="#f0f2f4"/><text data-box="trunk" x="58" y="495" font-size="20" fill="#52616f" font-weight="600">Token encoders + trunk</text><text data-box="trunk" x="58" y="523" font-size="20" fill="#52616f" font-weight="400">Recycled pair-only state</text><text data-box="trunk" x="58" y="551" font-size="20" fill="#52616f" font-weight="400">Distogram probabilities</text><text data-box="trunk" x="58" y="579" font-size="20" fill="#52616f" font-weight="400">All base weights frozen</text><rect id="esm-norm" x="400" y="180" width="650" height="62" rx="12" stroke="#a8b0b8" stroke-width="2" fill="#f0f2f4"/><text data-box="esm-norm" x="418" y="210" font-size="20" fill="#52616f" font-weight="600">esm_proj.0 · LayerNorm 1280</text><rect id="esm-one" x="400" y="270" width="310" height="90" rx="12" stroke="#246c98" stroke-width="2" fill="#eaf4fb"/><text data-box="esm-one" x="418" y="300" font-size="20" fill="#246c98" font-weight="600">esm_proj.1 + LoRA</text><text data-box="esm-one" x="418" y="328" font-size="20" fill="#246c98" font-weight="400">1280 → 384 · rank 4</text><rect id="esm-three" x="750" y="270" width="300" height="90" rx="12" stroke="#246c98" stroke-width="2" fill="#eaf4fb"/><text data-box="esm-three" x="768" y="300" font-size="20" fill="#246c98" font-weight="600">esm_proj.3 + LoRA</text><text data-box="esm-three" x="768" y="328" font-size="20" fill="#246c98" font-weight="400">384 → 384 · rank 4</text><path d="M 340,220 L 400,220" stroke="#6c7780" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 555,242 L 555,270" stroke="#6c7780" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 710,315 L 750,315" stroke="#6c7780" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text data-box="" x="690" y="255" font-size="18" fill="#52616f" font-weight="400">ReLU (.2) between projections</text><rect id="pair-input" x="400" y="410" width="650" height="118" rx="12" stroke="#a8b0b8" stroke-width="2" fill="#f0f2f4"/><text data-box="pair-input" x="418" y="440" font-size="20" fill="#52616f" font-weight="600">Add projected ESM to valid protein tokens</text><text data-box="pair-input" x="418" y="468" font-size="20" fill="#52616f" font-weight="400">Pair-state projection + single broadcasts</text><text data-box="pair-input" x="418" y="496" font-size="20" fill="#52616f" font-weight="400">Distogram conditioning → affinity pair state</text><path d="M 900,360 L 900,410" stroke="#6c7780" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 340,535 L 365,535 L 365,468 L 400,468" stroke="#6c7780" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect id="triangle" x="400" y="575" width="650" height="62" rx="12" stroke="#a8b0b8" stroke-width="2" fill="#f0f2f4"/><text data-box="triangle" x="418" y="605" font-size="20" fill="#52616f" font-weight="600">Block 0 · triangle multiplication + attention</text><path d="M 725,528 L 725,575" stroke="#6c7780" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect id="transition" x="400" y="675" width="650" height="150" rx="12" stroke="#a8b0b8" stroke-width="2" fill="#f0f2f4"/><text data-box="transition" x="418" y="705" font-size="20" fill="#52616f" font-weight="600">pairformer_stack.layers.0.transition_z</text><text data-box="transition" x="418" y="733" font-size="20" fill="#52616f" font-weight="400">norm → SiLU(fc1(x)) × fc2(x) → fc3 → residual</text><rect id="fc1" x="420" y="750" width="270" height="58" rx="12" stroke="#246c98" stroke-width="2" fill="#eaf4fb"/><text data-box="fc1" x="438" y="780" font-size="20" fill="#246c98" font-weight="600">fc1: 128 → 512 + LoRA</text><text data-box="" x="715" y="785" font-size="20" fill="#52616f" font-weight="400">fc2 / fc3 / norm frozen</text><path d="M 725,637 L 725,675" stroke="#6c7780" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect id="remaining" x="400" y="865" width="650" height="65" rx="12" stroke="#a8b0b8" stroke-width="2" fill="#f0f2f4"/><text data-box="remaining" x="418" y="895" font-size="20" fill="#52616f" font-weight="600">Blocks 1–7 · all base weights frozen</text><path d="M 725,825 L 725,865" stroke="#6c7780" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect id="pool" x="400" y="970" width="650" height="95" rx="12" stroke="#a8b0b8" stroke-width="2" fill="#f0f2f4"/><text data-box="pool" x="418" y="1000" font-size="20" fill="#52616f" font-weight="600">Masked pair pooling → affinity_out_mlp</text><text data-box="pool" x="418" y="1028" font-size="20" fill="#52616f" font-weight="400">128 → 128 → 384 · shared representation g</text><path d="M 725,930 L 725,970" stroke="#6c7780" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 1050,1017 L 1095,1017 L 1095,245 L 1140,245" stroke="#6c7780" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text data-box="" x="1140" y="190" font-size="20" fill="#52616f" font-weight="400">affinity_heads.</text><text data-box="" x="1140" y="218" font-size="22" fill="#ad501b" font-weight="600">to_affinity_pred_value</text><rect id="head-zero" x="1140" y="240" width="430" height="90" rx="12" stroke="#ad501b" stroke-width="2" fill="#fff0e6"/><text data-box="head-zero" x="1158" y="270" font-size="20" fill="#ad501b" font-weight="600">.0 · Linear 384 → 384</text><text data-box="head-zero" x="1158" y="298" font-size="20" fill="#ad501b" font-weight="400">Train weight [384,384] + bias [384]</text><rect id="head-two" x="1140" y="395" width="430" height="90" rx="12" stroke="#ad501b" stroke-width="2" fill="#fff0e6"/><text data-box="head-two" x="1158" y="425" font-size="20" fill="#ad501b" font-weight="600">.2 · Linear 384 → 384</text><text data-box="head-two" x="1158" y="453" font-size="20" fill="#ad501b" font-weight="400">Train weight [384,384] + bias [384]</text><rect id="head-four" x="1140" y="550" width="430" height="90" rx="12" stroke="#ad501b" stroke-width="2" fill="#fff0e6"/><text data-box="head-four" x="1158" y="580" font-size="20" fill="#ad501b" font-weight="600">.4 · Linear 384 → 1</text><text data-box="head-four" x="1158" y="608" font-size="20" fill="#ad501b" font-weight="400">Train weight [1,384] + bias [1]</text><path d="M 1355,330 L 1355,395" stroke="#6c7780" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text data-box="" x="1373" y="368" font-size="19" fill="#52616f" font-weight="400">ReLU (.1)</text><path d="M 1355,485 L 1355,550" stroke="#6c7780" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text data-box="" x="1373" y="523" font-size="19" fill="#52616f" font-weight="400">ReLU (.3)</text><path d="M 1355,640 L 1355,687" stroke="#6c7780" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect id="output" x="1140" y="687" width="430" height="110" rx="12" stroke="#a8b0b8" stroke-width="2" fill="#f0f2f4"/><text data-box="output" x="1158" y="717" font-size="20" fill="#52616f" font-weight="600">Both native member scalars</text><text data-box="output" x="1158" y="745" font-size="20" fill="#52616f" font-weight="400">Arithmetic mean → 6 − mean</text><text data-box="output" x="1158" y="773" font-size="20" fill="#52616f" font-weight="400">Adapted cellular pEC50</text><path d="M 1095,955 L 1140,955" stroke="#6c7780" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect id="binary" x="1140" y="865" width="430" height="175" rx="12" stroke="#a8b0b8" stroke-width="2" fill="#f0f2f4"/><text data-box="binary" x="1158" y="895" font-size="20" fill="#52616f" font-weight="600">Parallel binary branch · frozen</text><text data-box="binary" x="1158" y="923" font-size="20" fill="#52616f" font-weight="400">affinity_heads.to_affinity_pred_score</text><text data-box="binary" x="1158" y="951" font-size="20" fill="#52616f" font-weight="400">→ to_affinity_logits_binary</text><text data-box="binary" x="1158" y="979" font-size="20" fill="#52616f" font-weight="400">Weights fixed; outputs can change</text><text data-box="binary" x="1158" y="1007" font-size="20" fill="#52616f" font-weight="400">when upstream LoRA changes g</text><text data-box="" x="40" y="1107" font-size="23" fill="#52616f" font-weight="400">Orange: head weights + biases (both arms)     Blue: added A/B only (head + LoRA)     Gray: frozen base parameters</text></svg>