<svg id="nesso-native-pipeline" viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nesso-native-pipeline-title"><title id="nesso-native-pipeline-title">nesso native pipeline</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202830;font-size:13px}.label{font-weight:600;font-size:14px}.compact{font-size:12px}.small{font-size:11px;fill:#52606d}.mono{font-family:monospace;font-size:10px}.title{font-size:19px;font-weight:600}.num{font-size:12px;font-weight:600}.wire{fill:none;stroke:#77828a;stroke-width:1.25}.frozen{fill:#f4f5f6;stroke:#9da6ac;stroke-width:1}.plain{fill:white;stroke:#abb2b8;stroke-width:1}.head{fill:#e9f2fc;stroke:#2166ac;stroke-width:1.4}.adapter{fill:#fff6eb;stroke:#b85c00;stroke-width:1.3}.headtext{fill:#2166ac}.adaptertext{fill:#a85200}.frame{fill:none;stroke:#c1c7cc;stroke-width:1;stroke-dasharray:4 4}.rule{stroke:#d5dadd;stroke-width:1}</style><defs><marker id="nesso-native-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#77828a"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="20" y="29" class="title" text-anchor="start">A   Native Nesso-1: from features to distance distributions and affinity</text><text x="20" y="54" class="small" text-anchor="start">N = current trunk tokens; K = affinity-selected tokens. Batch axis omitted. Widths are channels, not token counts.</text><rect x="25" y="85" width="270" height="125" rx="2" class="frozen"/><text x="35" y="106" class="label" text-anchor="start">Atom + token input embedding</text><text x="35" y="125" class="small" text-anchor="start">Atom features: Linear 390 → 128</text><text x="35" y="141" class="small" text-anchor="start">Atom-pair channels: 16</text><text x="35" y="157" class="small" text-anchor="start">3 atom-attention layers · 4 heads</text><text x="35" y="173" class="small" text-anchor="start">Query/key windows: 32 / 128</text><rect x="25" y="245" width="270" height="94" rx="2" class="frozen"/><text x="35" y="266" class="label" text-anchor="start">Atom-to-token + residue type</text><text x="35" y="285" class="small" text-anchor="start">Linear 128 → 384 → ReLU; token mean</text><text x="35" y="301" class="small" text-anchor="start">Residue type: Linear 33 → 384; add</text><text x="35" y="317" class="small" text-anchor="start">s_inputs: [N, 384]</text><path d="M160 210 L160 245" class="wire" marker-end="url(#nesso-native-pipeline-arrow)"/><rect x="335" y="85" width="295" height="125" rx="2" class="frozen"/><text x="345" y="106" class="label" text-anchor="start">Initial pair representation</text><text x="345" y="125" class="small" text-anchor="start">Two Linear 384 → 128; broadcast-add</text><text x="345" y="141" class="small" text-anchor="start">Relative position: Linear 139 → 128</text><text x="345" y="157" class="small" text-anchor="start">Bond flag: Linear 1 → 128</text><text x="345" y="173" class="small" text-anchor="start">Bond type: Embedding 7 × 128</text><path d="M295 290 L315 290 L315 146 L335 146" class="wire" marker-end="url(#nesso-native-pipeline-arrow)"/><rect x="335" y="245" width="295" height="94" rx="2" class="frozen"/><text x="345" y="266" class="label" text-anchor="start">ESM features — separate input</text><text x="345" y="285" class="small" text-anchor="start">Precomputed s_esm: [N, 1280]</text><text x="345" y="301" class="small" text-anchor="start">Consumed here; ESM encoder runs outside</text><text x="345" y="317" class="small" text-anchor="start">this checkpoint / this forward graph.</text><rect x="674" y="75" width="500" height="370" rx="3" class="frame"/><text x="690" y="99" class="num" text-anchor="start">RECYCLED TRUNK · weights reused across passes</text><rect x="694" y="117" width="455" height="64" rx="2" class="frozen"/><text x="704" y="138" class="label" text-anchor="start">Recycle update</text><text x="704" y="157" class="small" text-anchor="start">z_init + Linear 128 → 128 (LayerNorm(z_previous))</text><rect x="694" y="201" width="455" height="101" rx="2" class="frozen"/><text x="704" y="222" class="label" text-anchor="start">ESM conditioning → additive pair update</text><text x="704" y="241" class="small" text-anchor="start">ESM: LN1280 → 1280→384 → ReLU → Dropout → 384→384</text><text x="704" y="257" class="small" text-anchor="start">+ token Linear 384→384; two Linear 384→128</text><text x="704" y="273" class="small" text-anchor="start">Broadcast-add over i,j; apply pair mask; residual add</text><rect x="694" y="322" width="455" height="74" rx="2" class="frozen"/><text x="704" y="343" class="label" text-anchor="start">Pair-only Pairformer × 48 blocks</text><text x="704" y="362" class="small" text-anchor="start">z: [N, N, 128] · triangle attention 4 heads × 32</text><text x="704" y="378" class="small" text-anchor="start">Block order expanded in Figure C.</text><path d="M630 146 L694 146" class="wire" marker-end="url(#nesso-native-pipeline-arrow)"/><path d="M630 286 L659 286 L659 251 L694 251" class="wire" marker-end="url(#nesso-native-pipeline-arrow)"/><path d="M921 181 L921 201" class="wire" marker-end="url(#nesso-native-pipeline-arrow)"/><path d="M921 302 L921 322" class="wire" marker-end="url(#nesso-native-pipeline-arrow)"/><path d="M1149 360 L1160 360 L1160 148 L1149 148" class="wire" marker-end="url(#nesso-native-pipeline-arrow)" stroke-dasharray="4 3"/><text x="694" y="425" class="small" text-anchor="start">5 recycling steps = 6 passes; optional crop after initial pass.</text><path d="M921 396 L921 471" class="wire" marker-end="url(#nesso-native-pipeline-arrow)"/><rect x="694" y="471" width="455" height="78" rx="2" class="frozen"/><text x="704" y="492" class="label" text-anchor="start">Symmetrize → distogram head</text><text x="704" y="511" class="small" text-anchor="start">z + zᵀ → Linear 128 → 64 distance-bin logits</text><text x="704" y="527" class="small" text-anchor="start">Pair representation z also bypasses this head.</text><rect x="25" y="471" width="605" height="97" rx="2" class="plain"/><text x="35" y="492" class="label" text-anchor="start">Frozen selection / cache boundary</text><text x="35" y="511" class="small" text-anchor="start">Expected distances → affinity pocket mask (15 Å protein cutoff)</text><text x="35" y="527" class="small" text-anchor="start">Crop s_inputs, z, logits, ESM and masks by the same indices; softmax logits</text><text x="35" y="543" class="small" text-anchor="start">Cached tensors: s [K,384], z [K,K,128], P [K,K,64], ESM [K,1280]</text><path d="M694 510 L630 510" class="wire" marker-end="url(#nesso-native-pipeline-arrow)"/><path d="M1149 360 L1183 360 L1183 586 L650 586 L650 543 L630 543" class="wire" marker-end="url(#nesso-native-pipeline-arrow)" stroke-dasharray="4 3"/><text x="335" y="367" class="num" text-anchor="start">Native refinement (current cache settings)</text><text x="335" y="389" class="small" text-anchor="start">After first trunk pass: distance-based crop at 22 Å,</text><text x="335" y="407" class="small" text-anchor="start">token-budget argument 256; subsequent passes reuse</text><text x="335" y="425" class="small" text-anchor="start">the same weights on the retained tokens.</text><path d="M185 568 L185 615" class="wire" marker-end="url(#nesso-native-pipeline-arrow)"/><path d="M485 568 L485 615" class="wire" marker-end="url(#nesso-native-pipeline-arrow)"/><rect x="25" y="615" width="300" height="85" rx="2" class="frozen"/><text x="35" y="636" class="label" text-anchor="start">Affinity member 1</text><text x="35" y="655" class="small" text-anchor="start">Independent 8-block affinity network</text><text x="35" y="671" class="small" text-anchor="start">Detailed layers: Figure B</text><text x="35" y="687" class="small" text-anchor="start">affinity_module</text><rect x="355" y="615" width="300" height="85" rx="2" class="frozen"/><text x="365" y="636" class="label" text-anchor="start">Affinity member 2</text><text x="365" y="655" class="small" text-anchor="start">Same architecture, separate parameters</text><text x="365" y="671" class="small" text-anchor="start">Same intervention applied to both</text><text x="365" y="687" class="small" text-anchor="start">affinity_module2</text><path d="M175 700 L175 730 L337 730 L337 748" class="wire" marker-end="url(#nesso-native-pipeline-arrow)"/><path d="M505 700 L505 730 L337 730" class="wire"/><rect x="170" y="748" width="365" height="64" rx="2" class="plain"/><text x="180" y="769" class="label" text-anchor="start">Mean continuous value: (v₁ + v₂) / 2</text><text x="180" y="788" class="small" text-anchor="start">Experiment’s nonlearned output conversion: ŷ = 6 − mean</text><rect x="720" y="630" width="429" height="92" rx="2" class="plain"/><text x="730" y="651" class="label" text-anchor="start">Native binary output (separate branch)</text><text x="730" y="670" class="small" text-anchor="start">Each member: logit → sigmoid → probability</text><text x="730" y="686" class="small" text-anchor="start">Average probabilities, not logits; returned ensemble</text><text x="730" y="702" class="small" text-anchor="start">logit is reconstructed from the clamped mean.</text><path d="M650 661 L720 661" class="wire" marker-end="url(#nesso-native-pipeline-arrow)"/><path d="M325 657 L340 657 L340 600 L680 600 L680 661" class="wire"/><text x="720" y="759" class="small" text-anchor="start">This checkpoint predicts distance distributions and affinity.</text><text x="720" y="779" class="small" text-anchor="start">It has no diffusion decoder or generated 3D-coordinate output.</text><text x="720" y="807" class="small" text-anchor="start">The cached boundary is not just a final 384-dimensional vector.</text></svg>